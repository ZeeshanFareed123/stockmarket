name: stockubl
description: "A scalable, mobile-first stock market application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  decimal: ^3.2.4
  dio: ^5.9.2
  flutter_riverpod: 3.0.3
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: ^0.20.3
  riverpod_annotation: 3.0.3
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  riverpod_generator: 3.0.3

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
